[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memequant"
version = "0.1.0"
description = "Point-in-time Solana/Pump.fun market-data engine for rigorous memecoin research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "MemeQuant Research"}]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "websockets>=15,<17",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pyarrow>=18,<24",
  "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
research = [
  "polars>=1.20,<2",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.5,<5",
]

[project.scripts]
memequant-collector = "memequant.cli.collector:main"
memequant-stats = "memequant.cli.stats:main"
memequant-replay = "memequant.cli.replay:main"
memequant-doctor = "memequant.cli.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memequant = ["idl/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
